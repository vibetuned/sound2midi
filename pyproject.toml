[project]
name = "sound2midi"
version = "0.1.0"
description = "Download audio from YouTube and transcribe it to MIDI with instrument-agnostic-amt."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # [default] brings yt-dlp-ejs (the YouTube JS-challenge solver — without it
    # media downloads 403); [deno] provides the JS runtime the solver needs.
    "yt-dlp[default,curl-cffi,deno]>=2026.7.4",
]

[project.optional-dependencies]
# The MIDI player GUI. Install with: uv sync --extra player
player = [
    "PySide6>=6.6",
    "pyfluidsynth>=1.3.3",
    "mido>=1.3",
    "numpy>=1.26",
    "music21>=9.1",
]
# MusicXML -> MEI conversion (sound2midi-mei). Install with: uv sync --extra mei
mei = [
    "music21>=9.1",
    "verovio==5.7.0",
    "lxml>=5",
]
# MPE expression engine (sound2midi-mpe / sound2midi-mpe-play).
# Install with: uv sync --extra mpe
mpe = [
    "mido>=1.3",
    "python-rtmidi>=1.5",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyloudnorm>=0.1",
    "pyyaml>=6",
    "tqdm>=4.60",
]

[project.scripts]
sound2midi = "sound2midi.cli:main"
sound2midi-play = "sound2midi.player.app:main"
sound2midi-mei = "sound2midi.mei:main"
sound2midi-mpe = "sound2midi.expression.cli:render_main"
sound2midi-mpe-play = "sound2midi.expression.cli:play_main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"
# `src/sound2midi/_amt` runs inside the AMT venv (imports `infer`, `stem_splitter`);
# `src/sound2midi/_songformer` runs inside the SongFormer venv (imports its modules).
# `vendor` holds third-party scripts we must not touch. None of these are our code.
extend-exclude = ["src/sound2midi/_amt", "src/sound2midi/_songformer", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.10"
root = ["./src"]

[tool.ty.src]
# tests/ rely on pytest's sys.path conftest injection and mido's dynamic
# Message attributes, which ty cannot model; pytest is their checker.
exclude = ["src/sound2midi/_amt", "src/sound2midi/_songformer", "vendor", "tests"]
